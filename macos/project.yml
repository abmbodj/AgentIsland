name: AgentIsland
options:
  bundleIdPrefix: com.abmbodj
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
packages:
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    from: 2.6.0
targets:
  AgentIsland:
    type: application
    platform: macOS
    sources:
      - path: AgentIsland
    dependencies:
      - package: Sparkle
    settings:
      base:
        PRODUCT_NAME: Agent Island
        PRODUCT_BUNDLE_IDENTIFIER: com.abmbodj.agentisland
        MARKETING_VERSION: 0.1.0
        CURRENT_PROJECT_VERSION: 1
        INFOPLIST_FILE: AgentIsland/Info.plist
        CODE_SIGN_ENTITLEMENTS: AgentIsland/AgentIsland.entitlements
        ENABLE_HARDENED_RUNTIME: YES
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: Apple Development
        DEVELOPMENT_TEAM: ZC5949HH2P
        SWIFT_VERSION: "5.0"
        SWIFT_INCLUDE_PATHS: $(SRCROOT)/../core/island-core/include
        LIBRARY_SEARCH_PATHS: $(SRCROOT)/../build/core
        OTHER_LDFLAGS: -lisland_core
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        DEAD_CODE_STRIPPING: YES
        SPARKLE_PUBLIC_KEY: 2Ue9VXJFD+DZdVxOt02a5LwI9Uj83QkKnILjVy1YJ8I=
    preBuildScripts:
      - name: Build Rust core
        script: '"$SRCROOT/../scripts/build-core.sh"'
        basedOnDependencyAnalysis: false
    postBuildScripts:
      - name: Package editor extension
        script: '"$SRCROOT/../scripts/build-vsix.sh" "$TARGET_BUILD_DIR/$UNLOCALIZED_RESOURCES_FOLDER_PATH/agent-island-jump.vsix"'
        basedOnDependencyAnalysis: false
      - name: Embed island-hook
        script: |
          set -e
          H="$TARGET_BUILD_DIR/$CONTENTS_FOLDER_PATH/Helpers"
          mkdir -p "$H"
          cp "$SRCROOT/../build/core/island-hook" "$H/island-hook"
          if [ "${CODE_SIGNING_ALLOWED:-YES}" = "YES" ] && [ -n "${EXPANDED_CODE_SIGN_IDENTITY:-}" ]; then
            TS="--timestamp=none"
            case "${CODE_SIGN_IDENTITY:-}" in "Developer ID"*) TS="--timestamp" ;; esac
            codesign --force --options runtime $TS --sign "$EXPANDED_CODE_SIGN_IDENTITY" "$H/island-hook"
          fi
        basedOnDependencyAnalysis: false
